<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replica status</title>
    <style>
        :root { --bg: #f7f7f5; --panel: #fff; --line: #d7d9de; --text: #171717; --muted: #5f6368; --accent: #2563eb; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
        .panel { width: min(720px, 100%); padding: 28px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
        .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        h1 { margin: 12px 0 8px; font-size: clamp(28px, 4vw, 42px); line-height: 1.1; }
        p { margin: 0 0 16px; color: var(--muted); line-height: 1.6; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 20px; }
        .tile { padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: #fafafa; }
        .label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
        .value { font-size: 16px; font-weight: 700; word-break: break-word; }
        code { color: var(--accent); }
        .status-url { margin-top: 18px; font-size: 14px; }
    </style>
</head>
<body>
    <main class="panel">
        <div class="eyebrow">Read-only replica</div>
        <h1>Replica is online</h1>
        <p>This node serves synchronized mailbox data. Administrative writes are disabled.</p>
        <div class="grid">
            <div class="tile"><span class="label">Role</span><span class="value" id="role">{{ cluster_role }}</span></div>
            <div class="tile"><span class="label">Mode</span><span class="value" id="mode">{% if read_only %}Read-only{% else %}Read-write{% endif %}</span></div>
            <div class="tile"><span class="label">Version</span><span class="value" id="app-version">{{ app_version }}</span></div>
            <div class="tile"><span class="label">Node</span><span class="value" id="node-id">-</span></div>
            <div class="tile"><span class="label">Records</span><span class="value" id="counts">-</span></div>
            <div class="tile"><span class="label">Stale deadline</span><span class="value" id="deadline">-</span></div>
        </div>
        <p class="status-url">Status endpoint: <code>{{ status_url }}</code></p>
        <p id="last-error"></p>
    </main>
    <script>
        fetch('{{ status_url }}', { cache: 'no-store' })
            .then((response) => response.json())
            .then((data) => {
                if (!data || !data.success) return;
                document.getElementById('role').textContent = data.role || '-';
                document.getElementById('mode').textContent = data.read_only ? 'Read-only' : 'Read-write';
                document.getElementById('app-version').textContent = data.app_version || '{{ app_version }}';
                document.getElementById('node-id').textContent = data.node_id || '-';
                const counts = data.counts || {};
                document.getElementById('counts').textContent = [counts.accounts ?? 0, counts.aliases ?? 0, counts.public_api ?? 0, counts.settings ?? 0].join(' / ');
                document.getElementById('deadline').textContent = data.stale_deadline_at || '-';
                document.getElementById('last-error').textContent = data.last_error ? `Last error: ${data.last_error}` : '';
            })
            .catch(() => {});
    </script>
</body>
</html>
