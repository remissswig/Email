<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导入邮箱</title><link rel="stylesheet" href="{{ url_for('static', filename='css/verification-links.css') }}">
</head>
<body>
  <header class="site-nav" aria-label="主导航">
    <div class="site-nav-inner">
      <a class="site-nav-brand" href="/" aria-label="返回邮箱主页">
        <span class="site-nav-mark" aria-hidden="true">✉</span>
        <span>Outlook Mail</span>
      </a>
      <a class="site-nav-back" href="/">← 返回邮箱主页</a>
    </div>
  </header>
  <main class="page">
    <header class="hero"><div><p class="eyebrow">OUTLOOK MAIL</p><h1>导入邮箱</h1><p class="lead">上传 TXT 文件或粘贴邮箱列表，为每个收件人生成独立的最新邮件访问链接。</p></div><div class="metric"><span>有效链接</span><strong id="activeCount">0</strong></div></header>
    <input id="files" type="file" accept=".txt,text/plain" multiple hidden>
    <section class="cards">
      <article class="card"><div class="card-title"><h2>TXT 文件导入</h2><span class="tag">首行主邮箱</span></div><button class="dropzone" type="button" id="singleFilePick"><span class="drop-icon">⇥</span><b>选择 TXT 文件</b><small>第一行主邮箱，后续每行一个收件人</small></button><p class="file-selection" id="singleFileSelection">未选择文件</p><label class="field-label">公开地址 <span>（选填，导出链接使用此地址）</span><input id="importBaseUrl" type="url" placeholder="例如：http://47.112.24.161:5001"></label><div class="card-actions"><select id="expiry"><option value="never">永久有效</option><option value="7d">7 天</option><option value="30d">30 天</option><option value="custom">自定义时间</option></select><input id="expiresAt" type="datetime-local" hidden><button class="button primary" id="import">导入并导出 TXT</button></div></article>
      <article class="card"><div class="card-title"><h2>批量 TXT 导入</h2><span class="tag">首行主邮箱</span></div><button class="dropzone" type="button" id="batchFilePick"><span class="drop-icon">▱</span><b>选择多个 TXT 文件</b><small>每个 TXT 第一行是主邮箱或别名</small></button><p class="file-selection" id="batchFileSelection">未选择文件</p><p class="hint">每个 TXT 按首行主邮箱规则解析，导入完成后自动下载 ZIP。</p><button class="button primary wide" id="batchImport" type="button">批量导入并导出 ZIP</button></article>
      <article class="card text-card"><div class="card-title"><h2>文本导入</h2><span class="tag">快速粘贴</span></div><label class="field-label">主邮箱 <span>（可选，清空后由导入规则处理）</span></label><div class="mailbox-combobox" data-mailbox-combobox><input id="textMainemail" type="text" role="combobox" aria-autocomplete="list" aria-controls="textMainemailOptions" aria-expanded="false" autocomplete="off" placeholder="输入邮箱或别名筛选"><button class="combobox-clear" type="button" aria-label="清空主邮箱" title="清空" hidden>×</button><div class="combobox-options" id="textMainemailOptions" role="listbox" hidden></div></div><textarea id="textRecipients" placeholder="recipient@example.com&#10;another@example.com"></textarea><p class="hint">每行一个邮箱，支持换行、空格和逗号分隔。</p><button class="button" id="textImport" type="button">使用文本导入</button></article>
      <article class="card export-card"><div class="card-title"><h2>公开地址设置</h2><span class="tag">导出链接</span></div><p class="hint">设置导出 TXT 或 ZIP 时使用的公开链接基址。</p><div class="setting-row"><input id="baseUrl" type="url" placeholder="公开链接基址（可选）"><button class="button" id="saveSettings">保存</button></div><span id="effective" class="muted"></span></article>
    </section>
  </main><div id="toast" class="toast" role="status"></div><script src="{{ url_for('static', filename='js/verification-links.js') }}"></script>
</body></html>
